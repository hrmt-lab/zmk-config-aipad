CONFIG_ZMK_KEYBOARD_NAME="aipad"

CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_BATTERY_REPORTING=y

CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_NRF5_RNG=y

CONFIG_RAW_HID=y
CONFIG_RAWHID_APP=y
CONFIG_RAWHID_APP_LAYER_CONTROL=y
CONFIG_RAWHID_APP_TIME_SYNC=y
CONFIG_RAWHID_APP_AI_USAGE=y
CONFIG_RAWHID_APP_LAYER_STATE_REPORT=y
CONFIG_RAWHID_APP_BATTERY_REPORT=y
CONFIG_RAWHID_APP_HOST_ACTION=y
CONFIG_RAWHID_APP_KEY_STATS=y
CONFIG_RAWHID_APP_KEY_PRESS=y
CONFIG_RAWHID_APP_CONFIG_RPC=y
CONFIG_RAWHID_APP_COMBO_RUNTIME=y
CONFIG_RAWHID_APP_COMBO_SETTINGS=y

CONFIG_NVS=y
CONFIG_SETTINGS=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_LV_COLOR_DEPTH_16=y
# Four screens means four sets of LVGL objects, so the pool is four times the
# single screen value (multiscreenkey uses 16384 for two).
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_COLOR_16_SWAP=y

CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y

# WS2812B status indicator (aipad_leds in the overlay, four LEDs chained on
# spi3). WS2812_STRIP_SPI already defaults to y once a devicetree node with
# its compatible exists, and it already selects SPI for itself - but that
# default is silent, so SPI is turned on explicitly here rather than relying
# on it, so a devicetree change can't make this quietly stop building.
CONFIG_SPI=y
CONFIG_LED_STRIP=y
# The status LED render work runs on ZMK's low-priority work queue rather
# than the main thread. Its default stack is 768 bytes and is shared with
# ZMK's battery ADC work; this is raised to 1024 to leave headroom for the
# WS2812 SPI transfer's frame buffer as well.
CONFIG_ZMK_LOW_PRIORITY_WORK_QUEUE=y
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=1024

# The EC11 driver itself is selected automatically by the alps,ec11 node, but
# its trigger mode defaults to "none", which never samples the encoder.
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Bring-up aids, off in normal builds. Enable both to light every panel at boot
# without waiting for the host, walk the panel signals one at a time, check for
# shorts between them, and get driver logs over a second USB CDC ACM port.
# CONFIG_AIPAD_DISPLAY_SELFTEST=y
# CONFIG_ZMK_USB_LOGGING=y

CONFIG_RAWHID_APP_AI_CLIENT_STATE=y
CONFIG_RAWHID_APP_AI_CLIENT_STATE_RENDERER=y
CONFIG_RAWHID_APP_AI_CLIENT_CLAUDE_CODE_RENDERER=y
# Four physical ScreenKeys: advertise capability bit 13 so the host sends the
# 8 byte payload, and retain one independent state per screen.
CONFIG_RAWHID_APP_AI_CLIENT_DISPLAY_SLOT_RENDERER=y
CONFIG_RAWHID_APP_AI_CLIENT_DISPLAY_SLOT_COUNT=4
